name: Release

on:
  release:
    types: [published]
  # Manual runs, to try the pipeline out. The APK is kept as a workflow artifact, and is also
  # attached to an existing release when its tag is given.
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name for this build
        required: true
        default: manual
      release_tag:
        description: Tag of an existing GitHub release to attach the APK to (optional)
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            # The release name, or its tag when the release was published without a name.
            version_name="${RELEASE_NAME:-$RELEASE_TAG}"
            version_code="$(date -u -d "$PUBLISHED_AT" +%s)"
            attach_tag="$RELEASE_TAG"
          else
            version_name="$INPUT_VERSION_NAME"
            version_code="$(date -u +%s)"
            attach_tag="$INPUT_RELEASE_TAG"
          fi
          # Safe for a file name: anything but letters, digits, dot, dash and underscore becomes a dash.
          file_version="$(printf '%s' "$version_name" | tr -c 'A-Za-z0-9._-' '-')"
          {
            echo "VERSION_NAME=$version_name"
            echo "VERSION_CODE=$version_code"
            echo "ATTACH_TAG=$attach_tag"
            echo "APK_NAME=mycardbalance-$file_version.apk"
            echo "MAPPING_NAME=mycardbalance-$file_version-mapping.txt"
          } >> "$GITHUB_ENV"
          echo "Building version name '$version_name', version code $version_code"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not available to this repository. Check the cloudwalkerlabs org secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Verify signature and name the files
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs androidApp/build/outputs/apk/release/androidApp-release.apk
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/$APK_NAME"
          cp androidApp/build/outputs/mapping/release/mapping.txt "dist/$MAPPING_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/

      - name: Attach APK to the GitHub release
        if: env.ATTACH_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$ATTACH_TAG" "dist/$APK_NAME" "dist/$MAPPING_NAME" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
